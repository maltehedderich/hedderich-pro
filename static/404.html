<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,follow" />
		<title>Page not found | Malte Hedderich</title>
		<link rel="stylesheet" href="/fonts.css" />
		<link rel="stylesheet" href="/design-tokens.css" />
		<link rel="stylesheet" href="/error-page.css" />
		<meta name="theme-color" content="#f5f5ee" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			:root {
				color-scheme: light;
				font-family: var(--font-editorial);
				font-weight: var(--weight-body);
				background: var(--surface);
				color: var(--color-ink);
				line-height: 1.5;
			}

			body {
				background: var(--surface);
				margin: 0;
				min-height: 100svh;
				text-rendering: optimizeLegibility;
			}

			a {
				align-items: center;
				border-radius: var(--radius-square);
				box-sizing: border-box;
				color: inherit;
				display: inline-flex;
				font-size: var(--text-meta);

				font-weight: 600;
				justify-content: center;
				line-height: 1.4;
				min-height: 3rem;
				padding: var(--space-sm) var(--space-md);
				text-decoration: none;
				transition:
					background-color var(--motion-fast) var(--motion-ease),
					color var(--motion-fast) var(--motion-ease),
					transform var(--motion-fast) var(--motion-ease);
			}

			a[data-variant='primary'] {
				background: var(--color-signal);
				color: var(--color-on-primary);
			}

			a[data-variant='primary']:hover {
				background: var(--color-signal-hover);
			}

			a[data-variant='primary']:active {
				background: var(--color-signal-active);
				transform: translateY(1px);
			}

			a[data-variant='secondary'] {
				background: var(--surface-container-high);
				color: var(--color-ink);
			}

			a[data-variant='secondary']:hover {
				background: var(--surface-container-highest);
			}

			a[data-variant='secondary']:active {
				background: var(--surface-container-high);
				transform: translateY(1px);
			}

			a:focus-visible {
				outline: var(--focus-ring-width) solid var(--outline-focus);
				outline-offset: var(--focus-ring-offset);
			}

			@media (prefers-reduced-motion: reduce) {
				a {
					transition-duration: 0.01ms;
				}

				a[data-variant='primary']:active,
				a[data-variant='secondary']:active {
					transform: none;
				}
			}
		</style>
	</head>
	<body>
		<main class="error-page" id="main-content" tabindex="-1">
			<section class="error-layout" aria-labelledby="not-found-title">
				<p class="error-status">404</p>
				<div class="error-body">
					<h1 class="error-title" id="not-found-title">Page not found</h1>
					<p class="error-copy">
						This URL has either moved or disappeared. The canonical pages are still available from
						the home page and writing archive.
					</p>
					<nav class="error-nav" aria-label="Useful links">
						<a data-variant="primary" href="/">Home</a>
						<a data-variant="secondary" href="/blog/">Blog</a>
					</nav>
				</div>
			</section>
		</main>
	</body>
</html>
