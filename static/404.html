<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,follow" />
		<title>Page not found | Malte Hedderich</title>
		<link rel="stylesheet" href="/fonts.css" />
		<link rel="stylesheet" href="/design-tokens.css" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			:root {
				color-scheme: light;
				font-family: var(--font-editorial);
				font-weight: var(--weight-body);
				background: var(--surface);
				color: var(--color-ink);
				line-height: 1.5;
			}

			body {
				background: var(--surface);
				margin: 0;
				min-height: 100svh;
				text-rendering: optimizeLegibility;
			}

			main {
				box-sizing: border-box;
				display: grid;
				min-height: 100svh;
				padding: clamp(2rem, 6vw, 5rem);
				place-items: center;
			}

			section {
				margin-inline: auto;
				max-width: 58rem;
				padding-block-end: clamp(2rem, 10vh, 7rem);
				width: 100%;
			}

			p:not(.kicker) {
				color: var(--color-muted);
				font-size: var(--text-lead);
				line-height: 1.75;
				margin: var(--space-md) 0 0;
				max-width: var(--measure-prose);
			}

			.kicker {
				color: var(--color-primary);
				font-size: var(--text-micro);
				font-weight: 700;
				letter-spacing: 0.08em;
				margin: 0 0 var(--space-sm);
				text-transform: uppercase;
			}

			h1 {
				font-family: var(--font-display);
				font-size: var(--text-display);
				font-weight: var(--weight-display);
				letter-spacing: var(--tracking-display);
				line-height: var(--leading-heading);
				margin: 0;
				max-width: 8ch;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				gap: var(--space-sm);
				margin-top: var(--space-lg);
			}

			a {
				align-items: center;
				border-radius: var(--radius-full);
				box-sizing: border-box;
				color: inherit;
				display: inline-flex;
				font-size: var(--text-meta);

				font-weight: 600;
				justify-content: center;
				letter-spacing: -0.01em;
				line-height: 1.1;
				min-height: 3rem;
				padding: var(--space-sm);
				text-decoration: none;
				transition:
					background-color var(--motion-fast) var(--motion-ease),
					color var(--motion-fast) var(--motion-ease),
					transform var(--motion-fast) var(--motion-ease);
			}

			a[data-variant='primary'] {
				background: var(--color-signal);
				color: var(--color-on-primary);
			}

			a[data-variant='primary']:hover {
				background: var(--color-signal-hover);
			}

			a[data-variant='primary']:active {
				background: var(--color-signal-active);
				transform: translateY(1px);
			}

			a[data-variant='secondary'] {
				background: var(--surface-container-high);
				color: var(--color-ink);
			}

			a[data-variant='secondary']:hover {
				background: var(--surface-container-highest);
			}

			a[data-variant='secondary']:active {
				background: var(--surface-container-high);
				transform: translateY(1px);
			}

			a:focus-visible {
				outline: var(--focus-ring-width) solid var(--outline-focus);
				outline-offset: var(--focus-ring-offset);
			}

			@media (min-width: 64rem) {
				section {
					padding-inline-end: 16rem;
				}
			}

			@media (max-width: 30rem) {
				nav {
					align-items: stretch;
					flex-direction: column;
				}

				a {
					justify-content: flex-start;
					width: 100%;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				a {
					transition-duration: 0.01ms;
				}

				a[data-variant='primary']:active,
				a[data-variant='secondary']:active {
					transform: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section aria-labelledby="not-found-title">
				<p class="kicker">404</p>
				<h1 id="not-found-title">Page not found</h1>
				<p>
					This URL has either moved or disappeared. The canonical pages are still available from the
					home page and writing archive.
				</p>
				<nav aria-label="Useful links">
					<a data-variant="primary" href="/">Home</a>
					<a data-variant="secondary" href="/blog/">Blog</a>
				</nav>
			</section>
		</main>
	</body>
</html>
