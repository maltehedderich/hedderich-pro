<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,follow" />
		<title>Page not found | Malte Hedderich</title>
		<style>
			:root {
				color-scheme: light;
				--surface: #f6f4ee;
				--surface-container-low: #ece8de;
				--surface-container-high: #e2dccf;
				--surface-container-lowest: #fbfaf6;
				--color-ink: #0a141f;
				--color-muted: #5f6670;
				--color-primary: #7b5900;
				--color-primary-active: #654700;
				--color-on-primary: #f8f6ef;
				--color-accent: #fbc75d;
				--outline-focus: #f8d989;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: var(--surface);
				color: var(--color-ink);
			}

			body {
				background:
					radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0) 30%),
					radial-gradient(circle at 86% 12%, rgba(216, 175, 79, 0.04) 0%, rgba(216, 175, 79, 0) 22%),
					var(--surface);
				margin: 0;
				min-height: 100svh;
				text-rendering: optimizeLegibility;
			}

			main {
				box-sizing: border-box;
				display: grid;
				min-height: 100svh;
				padding: clamp(2rem, 6vw, 5rem);
				place-items: center;
			}

			section {
				margin-inline: auto;
				max-width: 58rem;
				padding-block-end: clamp(2rem, 10vh, 7rem);
				width: 100%;
			}

			p {
				color: var(--color-muted);
				font-size: clamp(1.1rem, 1.6vw, 1.35rem);
				line-height: 1.7;
				margin: clamp(1.25rem, 3vw, 1.75rem) 0 0;
				max-width: 39rem;
			}

			.kicker {
				color: var(--color-primary);
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.18em;
				line-height: 1.2;
				margin: 0 0 clamp(1rem, 2.2vw, 1.4rem);
				text-transform: uppercase;
			}

			h1 {
				font-size: clamp(4.4rem, 13vw, 10.5rem);
				font-weight: 700;
				letter-spacing: 0;
				line-height: 0.88;
				margin: 0;
				max-width: 8ch;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.85rem;
				margin-top: clamp(2rem, 4vw, 2.75rem);
			}

			a {
				align-items: center;
				border-radius: 9999px;
				box-sizing: border-box;
				color: inherit;
				display: inline-flex;
				font-weight: 700;
				justify-content: center;
				line-height: 1.1;
				min-height: 3rem;
				padding: 0.9rem 1.1rem;
				text-decoration: none;
				transition:
					background-color 180ms ease,
					color 180ms ease;
			}

			a[data-variant="primary"] {
				background: linear-gradient(135deg, var(--color-primary) 0%, #8f6812 100%);
				color: var(--color-on-primary);
			}

			a[data-variant="primary"]:hover {
				background: linear-gradient(135deg, var(--color-primary-active) 0%, #78560e 100%);
			}

			a[data-variant="secondary"] {
				background: color-mix(in srgb, var(--surface-container-low) 76%, white 24%);
				color: var(--color-ink);
			}

			a[data-variant="secondary"]:hover {
				background: color-mix(in srgb, var(--surface-container-high) 82%, white 18%);
			}

			a:focus-visible {
				outline: 2px solid var(--outline-focus);
				outline-offset: 4px;
			}

			@media (min-width: 64rem) {
				section {
					padding-inline-end: 16rem;
				}
			}

			@media (max-width: 30rem) {
				nav {
					align-items: stretch;
					flex-direction: column;
				}

				a {
					justify-content: flex-start;
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section aria-labelledby="not-found-title">
				<p class="kicker">404</p>
				<h1 id="not-found-title">Page not found</h1>
				<p>This URL has either moved or disappeared. The canonical pages are still available from the home page and writing archive.</p>
				<nav aria-label="Useful links">
					<a data-variant="primary" href="/">Home</a>
					<a data-variant="secondary" href="/blog/">Blog</a>
				</nav>
			</section>
		</main>
	</body>
</html>
